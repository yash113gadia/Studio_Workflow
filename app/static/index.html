<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Preeti Studio</title>
  <link rel="stylesheet" href="/static/studio.css?v=2" />
</head>
<body>
  <div id="app">
    <aside class="sidebar">
      <div class="brand">
        <div class="brand-mark">P</div>
        <div><div class="brand-name">Preeti Studio</div><div class="brand-sub">Local AI film OS</div></div>
      </div>
      <nav class="nav">
        <a href="#/home" data-route="home"><span class="ico">⌂</span>Home</a>
        <a href="#/new" data-route="new"><span class="ico">＋</span>New video</a>
        <a href="#/library" data-route="library"><span class="ico">▦</span>Library</a>
        <a href="#/editor" data-route="editor"><span class="ico">✎</span>Image editor</a>
        <a href="#/gallery" data-route="gallery"><span class="ico">▶</span>Renders</a>
        <a href="#/engines" data-route="engines"><span class="ico">⚙</span>Engines</a>
      </nav>
      <div class="sidebar-foot">
        <div class="sys" id="sys-gpu">GPU —</div>
        <div class="sys" id="sys-queue">Queue —</div>
        <div class="sys muted" id="sys-status">Connecting…</div>
      </div>
    </aside>
    <main id="view" class="view"></main>
    <div id="jobs-dock" class="jobs-dock collapsed">
      <button class="dock-head" id="dock-toggle"><span id="dock-title">Jobs</span><span class="dock-caret">▴</span></button>
      <div class="dock-body">
        <div id="dock-jobs" class="dock-jobs"></div>
        <pre id="dock-console" class="dock-console"></pre>
      </div>
    </div>
    <div id="modal-root"></div>
    <div id="toasts" class="toasts"></div>
  </div>
  <script src="/static/studio.js?v=2"></script>
</body>
</html>
