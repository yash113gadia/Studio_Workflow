# AI Studio Configuration
studio_name: "Preeti Studio Local AI OS"
version: "0.1.0"
environment: "development"

paths:
  root: "C:\\Users\\nikhi\\Preeti_Studio"
  configs: "configs"
  database: "database\\studio.db"
  models: "models"
  workflows: "workflows"
  projects: "projects"
  shared_assets: "shared_assets"
  logs: "logs"
  cache: "cache"
  temp: "temp"

server:
  host: "127.0.0.1"
  port: 8000
  cors_origins:
    - "http://127.0.0.1:8188"
    - "http://localhost:8188"
    - "http://127.0.0.1:8000"
    - "http://localhost:8000"

gpu_lease:
  resource_name: "GPU0_HEAVY"
  heartbeat_interval_seconds: 5
  lease_timeout_seconds: 30

queue:
  max_concurrent_heavy_jobs: 1
  heartbeat_timeout_seconds: 60
  max_attempts: 3

safety:
  minimum_free_disk_gb: 80.0
